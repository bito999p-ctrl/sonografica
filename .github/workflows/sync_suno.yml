name: Sync Suno Playlists

on:
  schedule:
    # Runs everyday at 03:00 UTC (12:00 JST / 日本時間 昼12時)
    - cron: '0 3 * * *'
  workflow_dispatch: # 手動実行ボタン（いつでも即座に同期可能）

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Suno sync script
        run: python scripts/sync_suno_playlists.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add script.js scripts/suno_catalog.json
          if git diff --staged --quiet; then
            echo "No changes in Suno playlists."
          else
            git commit -m "Auto-sync Suno playlists [skip ci]"
            git push
            echo "Pushed updated Suno playlists to repository."
          fi
